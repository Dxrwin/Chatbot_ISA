name: Flujo Universidades 2025-Nuñez
version: 20250402102425
statuses:
  processing:
    actions:
      - action: form
      - action: conditional
        description: Revisa si es estudiante
        params:
          when: Credit.DebtorProfile.HasValue("native", "economicActivity", "4")
          then:
            - action: check-id
              description: Valida de identidad
              params:
                flowName: Validacion_ONE2CREDIT
            - action: conditional
              description: Verifica estado de validación de identidad
              params:
                when: IsIDValid == false
                then:
                  - action: update-credit
                    params:
                      status: pending
                      descriptionFrom: check-id
            - action: colateral
              params:
                coOwners: 1
                description: Solicita Codeudor
            - action: webhook
              description: Crea al cliente en Siigo
              params:
                tag: Creacion_cliente
                description: Crea al cliente en Siigo
            - action: update-credit
              params:
                status: approved
                description: Crédito con cotitular probado
      - action: conditional
        description: Evalua historial del cliente.
        params:
          when: hasOutstandingCredits() == true && hasDebtDays(29) == false
          then:  
            - action: check-id
              description: Valida de identidad
              params:
                flowName: Validacion_ONE2CREDIT
            - action: conditional
              description: Verifica estado de validación de identidad
              params:
                when: IsIDValid == false
                then:
                  - action: update-credit
                    params:
                      status: pending
                      descriptionFrom: check-id
            - action: webhook
              description: Crea al cliente en Siigo
              params:
                tag: Creacion_cliente
                description: Crea al cliente en Siigo
            - action: update-credit
              params:
                status: approved
                description: Crédito aprobado, cliente con créditos anteriores y sin moras de más de 29 días
      - action: conditional
        description: Evalua historial del cliente.
        params:
          when: hasOutstandingCredits() == false || hasDebtDays(29) == true
          then:  
            - action: charge
              description: Cobra estudios de crédito
              params:
                key: external-costs
                type: costs
                description: cargos por solicitud
                costs:
                  - estudio-express
            - action: webhook
              description: Crea factura de costo express
              params:
                tag: Factura_costo_externo
                description: Crea factura de costo express
            - action: check-id
              description: Valida de identidad
              params:
                flowName: Validacion_ONE2CREDIT
            - action: conditional
              description: Verifica estado de validación de identidad
              params:
                when: IsIDValid == false
                then:
                  - action: update-credit
                    params:
                      status: pending
                      descriptionFrom: check-id
            - action: analysis
              description: Estudio por defecto
              params:
                cached: false
                verification:
                  run: true
                scoring:
                  run: true
                  reports:
                    run: true
                    datacreditoAciertaQuanto: true
                capacity:
                  run: true
                creditLimit:
                  run: true
            - action: conditional
              description: Evalúa el score provisto por Acierta+
              params:
                  when: Credit.CreditAnalysis.AciertaScore() < 651 && Credit.CreditAnalysis.AciertaScore() != 0 && Credit.CreditAnalysis.AciertaScore() != 4 && Credit.CreditAnalysis.AciertaScore() != 7
                  then:
                    - action: conditional
                      description: Evalua historial del cliente.
                      params:
                        when: hasOutstandingCredits() == false
                        then:  
                          - action: update-credit
                            params:
                              status: rejected
                              description: Crédito rechazado, Cliente con bajo scoring Acierta sin créditos anteriores.
                        else:
                          - action: update-credit
                            params:
                                status: pending
                                description: Crédito pendiente, Cliente con bajo scoring Acierta con créditos anteriores
            - action: conditional
              description: Evalúa el monto
              params:
                  when:  Credit.PrincipalCom("<","4000000")
                  then:
                    - action: approval-rules
                      description: Evalua reglas de aprobación
            - action: conditional
              description: Evalúa el score provisto por Acierta+
              params:
                  when: Credit.CreditAnalysis.AciertaScore() < 700
                  then:
                    - action: update-credit
                      params:
                          status: pending
                          description: Crédito pendiente, puntaje Acierta menor a 700
            - action: conditional
              description: Evalúa el score provisto por Acierta+ y monto
              params:
                  when: Credit.CreditAnalysis.AciertaScore() >= 700 && Credit.PrincipalCom("<","6000000")
                  then:
                    - action: approval-rules
                      description: Evalua reglas de aprobación
            - action: conditional
              description: Evalúa el score provisto por Acierta+
              params:
                  when: Credit.CreditAnalysis.AciertaScore() < 740
                  then:
                    - action: update-credit
                      params:
                          status: pending
                          description: Crédito pendiente, puntaje Acierta menor a 740
            - action: conditional
              description: Evalúa el score provisto por Acierta+ y monto
              params:
                  when: Credit.CreditAnalysis.AciertaScore() > 740 && Credit.PrincipalCom("<","10000000")
                  then:
                    - action: approval-rules
                      description: Evalua reglas de aprobación
            - action: conditional
              description: Evalúa el score provisto por Acierta+ y monto
              params:
                  when: Credit.PrincipalCom(">","10000000")
                  then:
                    - action: update-credit
                      params:
                          status: pending
                          description: Crédito pendiente, Monto mayor a 10 millones
            - action: approval-rules
              description: Evalua reglas de aprobación
  approved:
    actions:
      - action: make-fng-reservation
      - action: create-documents
        description: Crea los documentos asociados que estén faltando
      - action: conditional
        description: Verifica si está faltando firmar algún documento
        params:
          when: Credit.IsSignatureRequired() == false
          then:
            - action: update-credit
              description: Pone el crédito en estado formalizado
              params:
                status: forDisbursement
  forDisbursement:
    actions:
      - action: charge
        description: Cobro de cuota inicial
        params:
          key: cuota_inicial
          type: initial_fee
          description: cobro de cuota inicial
          nextStatus: forDisbursement
      - action: disbursement          
  disbursing:
    actions:
      - action: webhook
        description: Crea comprobante contable de cuota inicial
        params:
          tag: Cuenta_cobro_cuota_incial
          description: Crea comprobante contable de cuota inicial
  undelivered:
  rejected:
  disbursed:
    actions:
      - action: make-fng-registration
  paid:
  desisted:
  debt:
  undisbursed:  